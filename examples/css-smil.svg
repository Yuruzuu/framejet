<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <style>
    @keyframes reveal {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #title { animation: reveal 0.8s ease-out both; }
    #subtitle { animation: reveal 0.8s 0.3s ease-out both; }
    text { font-family: Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b35"/><stop offset="1" stop-color="#080d19"/>
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#5cf0cb"/><stop offset="1" stop-color="#6c9cff"/></linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#background)"/>
  <circle cx="710" cy="240" r="140" fill="none" stroke="#203254"/>
  <circle cx="710" cy="240" r="95" fill="none" stroke="#304b72" stroke-width="2"/>
  <circle cx="710" cy="240" r="52" fill="url(#accent)"/>
  <g>
    <circle cx="805" cy="240" r="12" fill="#d6fff4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 710 240" to="360 710 240" dur="4s" repeatCount="indefinite"/>
  </g>
  <text id="title" x="76" y="244" font-size="76" font-weight="bold" fill="#f1f6ff">Framejet</text>
  <text id="subtitle" x="80" y="296" font-size="23" fill="#a7bad9">CSS and SMIL, sampled in time.</text>
  <rect x="80" y="420" width="800" height="4" rx="2" fill="#203254"/>
  <rect x="80" y="420" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" from="0" to="800" dur="4s" fill="freeze"/>
  </rect>
  <text x="80" y="464" font-size="14" fill="#7d94b5">CSS KEYFRAMES + SMIL · NO ANIMATION ADAPTER</text>
</svg>
