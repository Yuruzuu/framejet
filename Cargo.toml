[package]
name = "framejet"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Render SVG and Three.js animations to video with a Rust CLI"
license = "MIT"
repository = "https://github.com/Yuruzuu/framejet"
include = ["src/**", "runtime/worker.mjs", "runtime/frame-transport.js", "runtime/package.json", "runtime/package-lock.json", "README.md", "LICENSE", "Cargo.lock"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
png = "0.18"
rayon = "1"
resvg = "0.49"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
